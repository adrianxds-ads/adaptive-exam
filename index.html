<div class="app">
<section id="startScreen" class="screen center"><div class="panel">
<div class="kicker">B2 FIRST · READING &amp; USE OF ENGLISH</div><h1>Practice<br>Bank</h1>
<p class="subtitle">Elige una de las cuatro Parts. Dentro tienes los 30 exámenes numerados para avanzar en orden o abrir cualquiera.</p>
<div id="bankProgress" class="bank-progress"></div><div id="globalStats" class="mini-stats"></div>
<div id="partList" class="part-list"></div>
<div id="phaseNote" class="phase-note hidden"></div>
</div></section>

</section>
<section id="paperScreen" class="screen hidden">
<header class="paper-head"><div class="paper-head-row"><button id="backBtn" class="back" aria-label="Back">←</button><div class="paper-title"><b id="headPart">Part 1</b><span id="headSource"></span></div><div></div></div></header>
<main id="paperHost" class="paper"></main></section>
<section id="resultScreen" class="screen hidden">

<main class="paper"><div id="reviewSummary"></div><div id="reviewHost" class="review-list"></div><div id="reviewActions" class="review-actions"></div></main></section>
</div>
<div id="choiceSheet" class="sheet hidden"><div class="sheet-card"><div class="sheet-top"><b id="sheetTitle">Question 1</b><button id="sheetClose" class="sheet-close">×</button></div><div id="sheetContext" class="sheet-context hidden"></div><div id="optionGrid" class="option-grid"></div></div></div>
