<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10271d">
<title>B2 First · Practice Bank</title>
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<style>
:root{--bg:#10271d;--panel:#172f24;--paper:#f8f7f2;--ink:#17211c;--muted:#b7c9bf;--line:rgba(255,255,255,.13);--ok:#27925c;--bad:#c74253}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:#f4f7f5}
body{background:radial-gradient(90% 70% at 110% 5%,rgba(47,94,67,.55),transparent 55%),radial-gradient(80% 60% at -10% 95%,rgba(39,78,57,.45),transparent 55%),linear-gradient(180deg,#163427 0%,#102d21 52%,#10271d 100%)}
button,input{font:inherit}.app{width:min(900px,100%);margin:0 auto;min-height:100dvh}.screen{min-height:100dvh;padding:18px 14px calc(28px + env(safe-area-inset-bottom));display:flex;flex-direction:column}.hidden{display:none!important}
.panel{background:rgba(17,38,28,.95);border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 55px rgba(0,0,0,.20)}.center{justify-content:center}
.kicker{font-size:14px;font-weight:950;letter-spacing:.13em;text-transform:uppercase;color:#c9ddd1}h1{font-size:clamp(44px,10vw,70px);line-height:.94;margin:8px 0 10px;letter-spacing:-.045em}.subtitle{font-size:20px;line-height:1.45;font-weight:750;color:#d9e7df;margin:0 0 18px}
.bank-progress{font-size:14px;font-weight:950;letter-spacing:.08em;text-transform:uppercase;color:#c9ddd1;margin:10px 0}.mini-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0 18px}.stat{padding:12px 8px;border-radius:11px;background:rgba(0,0,0,.15);text-align:center}.stat b{display:block;font-size:24px}.stat span{font-size:10px;color:var(--muted);font-weight:900;letter-spacing:.04em}
.part-list{display:grid;gap:12px}.exercise-list{display:grid;gap:12px}.exam-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}.exam-tile{min-height:112px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(255,255,255,.07);color:#fff;padding:12px 10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between}.exam-tile:hover{background:rgba(255,255,255,.11)}.exam-tile.done{border-color:rgba(143,224,180,.55);background:rgba(39,146,92,.16)}.exam-tile.next{box-shadow:0 0 0 2px rgba(232,201,134,.45) inset}.exam-tile.unavailable{opacity:.43;cursor:not-allowed}.exam-no{font-size:31px;font-weight:950;line-height:1}.exam-status{font-size:10px;font-weight:950;letter-spacing:.07em}.exam-mini{font-size:11px;line-height:1.25;color:var(--muted);font-weight:800}.bank-source{font-size:10px;font-weight:900;letter-spacing:.05em;color:#cbdad2}.part-stats{margin-bottom:16px}.part-card,.exercise-card{border:1px solid rgba(255,255,255,.10);border-radius:15px;background:rgba(255,255,255,.075);color:#fff;padding:18px;text-align:left;cursor:pointer}.part-card:hover,.exercise-card:hover{background:rgba(255,255,255,.11)}.part-card>b,.exercise-card>b{display:block;font-size:24px;margin:6px 0}.exercise-top{display:flex;justify-content:space-between;gap:10px}.exercise-part,.exercise-number,.exercise-state,.part-count{font-size:12px;font-weight:950;letter-spacing:.08em}.exercise-state.done{color:#8fe0b4}.exercise-state.pending{color:#e8c986}.part-count{color:#d8e8df}.part-desc,.exercise-source,.exercise-meta{display:block;color:var(--muted);font-size:15px;line-height:1.45;margin-top:6px}.part-desc{color:#d6e3dc}.phase-note{margin-top:16px;padding:15px;border-radius:12px;background:rgba(39,146,92,.15);border:1px solid rgba(143,224,180,.25);font-size:16px;line-height:1.5}.submenu-head{margin-bottom:16px}.submenu-head h2{font-size:clamp(30px,7vw,42px);line-height:1.05;margin:4px 0 8px}.submenu-head p{font-size:17px;line-height:1.45;color:#d9e7df;margin:0}
.paper-head{position:sticky;top:0;z-index:7;margin:-18px -14px 14px;padding:12px 14px 10px;background:rgba(16,39,29,.96);backdrop-filter:blur(10px);border-bottom:1px solid rgba(255,255,255,.09)}.paper-head-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center}.back{width:46px;height:46px;border:1px solid rgba(255,255,255,.14);border-radius:50%;background:rgba(0,0,0,.15);color:#fff;font-size:20px;cursor:pointer}.paper-title{text-align:center}.paper-title b{display:block;font-size:20px}.paper-title span{font-size:11px;color:var(--muted);font-weight:900;letter-spacing:.04em}
.paper{background:var(--paper);color:var(--ink);border-radius:18px;padding:clamp(21px,5vw,44px);box-shadow:0 24px 60px rgba(0,0,0,.22)}.part-label{font-size:14px;font-weight:950;letter-spacing:.12em;text-transform:uppercase;color:#53645b}.paper h2{font-size:clamp(32px,7vw,48px);line-height:1;margin:5px 0 9px}.paper .sub{font-size:20px;font-weight:850;margin-bottom:13px}.instructions,.source-box{font-size:18px;line-height:1.5;padding:15px 17px;border-radius:11px;background:#ecebe5;margin:0 0 19px}.instructions{border-left:5px solid #86988e}.source-box{display:grid;gap:3px;background:#e4ece7}.source-box b{font-size:10px;letter-spacing:.09em;color:#506158}.source-box span{font-weight:900}.source-box small{color:#64736b}
.exam-text{font-family:Georgia,"Times New Roman",serif;font-size:clamp(23px,3.5vw,27px);line-height:1.75}.exam-text p{margin:0}.gap-wrap{display:inline-flex;align-items:center;vertical-align:baseline;gap:5px;margin:0 3px;white-space:nowrap}.gap-num{font-family:Inter,Roboto,sans-serif;font-size:11px;font-weight:950;color:#53645b;align-self:flex-start;margin-top:4px}.gap-choice{border:0;border-bottom:3px solid #375546;background:#e5ece7;color:#173126;border-radius:7px;padding:3px 8px 4px;font-family:Inter,Roboto,sans-serif;font-size:.82em;font-weight:900;cursor:pointer;min-width:62px}.gap-choice.empty{background:#edf0ed;color:#647269}
.inline-input{width:150px;max-width:40vw;border:0;border-bottom:3px solid #375546;border-radius:4px 4px 0 0;background:#eef1ee;color:#173126;padding:3px 8px 4px;font-family:Inter,Roboto,sans-serif;font-size:.82em;font-weight:850;outline:none}.inline-input:focus{background:#fff;border-color:#0f2a1e}.base-pill{font-family:Inter,Roboto,sans-serif;font-size:11px;font-weight:950;letter-spacing:.05em;background:#dde3de;color:#43534a;padding:4px 7px;border-radius:999px;margin-left:4px}
.transform-list{display:grid;gap:16px}.transform{border:1px solid #d9ddd9;border-radius:12px;padding:18px;background:#fff}.transform .n{font-size:12px;font-weight:950;color:#68766f}.transform .first{font-size:20px;line-height:1.4;font-weight:700;margin:6px 0 10px}.keyword{display:inline-block;background:#173126;color:#fff;border-radius:7px;padding:5px 9px;font-weight:950;letter-spacing:.05em;margin-bottom:10px}.second{font-size:20px;line-height:1.55}.transform-input{width:min(330px,100%);border:0;border-bottom:3px solid #375546;background:#eef1ee;padding:5px 8px;font-size:19px;font-weight:800;outline:none}
.paper-actions,.review-actions{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:11px;padding:14px 18px;font-weight:950;cursor:pointer;font-size:16px}.primary{background:#173126;color:#fff;flex:1}.secondary{background:#e6e8e6;color:#25342c}
.review-score{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid #d5dcd7}.review-score b{font-size:42px}.review-score span{font-size:14px;font-weight:850;color:#617068}.review-list{display:grid;gap:12px}.review-item{border-radius:12px;padding:16px;background:#fff;border:1px solid #d8ddd9}.review-item.review-bad{border-left:6px solid var(--bad)}.review-item.review-ok{border-left:6px solid var(--ok)}.review-q{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}.review-q span{font-size:11px;font-weight:950;letter-spacing:.07em}.review-ok .review-q span{color:#147747}.review-bad .review-q span{color:#a92639}.review-answer{display:grid;gap:2px;margin:8px 0}.review-answer small{font-size:9px;font-weight:950;letter-spacing:.08em;color:#68766f}.review-answer b{font-size:20px}.review-item p{font-size:18px;line-height:1.5;margin:12px 0}.skill{display:inline-block;border-radius:999px;background:#edf0ed;padding:5px 8px;font-size:10px;font-weight:950;color:#526158;letter-spacing:.04em}
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:flex;align-items:flex-end;justify-content:center;padding:14px}.sheet-card{width:min(760px,100%);background:#173126;color:#fff;border-radius:20px;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.4)}.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.sheet-top b{font-size:21px}.sheet-close{border:0;background:rgba(255,255,255,.1);color:#fff;width:40px;height:40px;border-radius:50%;font-size:20px}.option-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.option{border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.08);color:#fff;border-radius:11px;padding:17px;text-align:left;font-size:22px;font-weight:850;cursor:pointer}.option strong{margin-right:8px}
@media(max-width:640px){.screen{padding:12px 10px 22px}.exam-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.exam-tile{min-height:106px;padding:11px 9px}.exam-no{font-size:30px}.panel{padding:20px 16px}.mini-stats{grid-template-columns:1fr 1fr}.paper-head{margin:-12px -10px 12px;padding:10px}.paper-head-row{grid-template-columns:46px 1fr 46px}.paper-title b{font-size:19px}.paper-title span{font-size:10px}.paper{border-radius:14px;padding:21px 16px}.paper h2{font-size:34px}.instructions{font-size:18px;padding:14px}.exam-text{font-size:22px;line-height:1.7}.inline-input{width:125px;max-width:48vw}.option-grid{grid-template-columns:1fr}.transform{padding:16px}.transform .first,.second{font-size:20px}.transform-input{font-size:20px;width:100%;display:block;margin:8px 0}.review-score{align-items:start;flex-direction:column}.review-score b{font-size:40px}.part-card>b,.exercise-card>b{font-size:23px}.part-desc,.exercise-source,.exercise-meta{font-size:15px}}
</style>
</head>
<body>
<div class="app">
<section id="startScreen" class="screen center"><div class="panel">
<div class="kicker">B2 FIRST · READING &amp; USE OF ENGLISH</div><h1>Practice<br>Bank</h1>
<p class="subtitle">Elige una de las cuatro Parts. Dentro tienes los 30 exámenes numerados para avanzar en orden o abrir cualquiera.</p>
<div id="bankProgress" class="bank-progress"></div><div id="globalStats" class="mini-stats"></div>
<div id="partList" class="part-list"></div>
<div id="phaseNote" class="phase-note hidden"></div>
</div></section>
<section id="partScreen" class="screen hidden">
<header class="paper-head"><div class="paper-head-row"><button id="partBackBtn" class="back" aria-label="Back">←</button><div class="paper-title"><b>30 exámenes</b><span>ELIGE CUALQUIERA</span></div><div></div></div></header>
<div class="panel"><div class="submenu-head"><div class="kicker">B2 FIRST · PRACTICE BANK</div><h2 id="partMenuTitle">Part 1</h2><p id="partMenuSubtitle"></p></div><div id="partStats" class="mini-stats part-stats"></div><div id="exerciseList" class="exam-grid"></div></div>
</section>
<section id="paperScreen" class="screen hidden">
<header class="paper-head"><div class="paper-head-row"><button id="backBtn" class="back" aria-label="Back">←</button><div class="paper-title"><b id="headPart">Part 1</b><span id="headSource"></span></div><div></div></div></header>
<main id="paperHost" class="paper"></main></section>
<section id="resultScreen" class="screen hidden">
<header class="paper-head"><div class="paper-head-row"><button id="resultBackBtn" class="back" aria-label="Back">←</button><div class="paper-title"><b id="resultTitle">Corrección</b><span id="resultSource"></span></div><div></div></div></header>
<main class="paper"><div id="reviewSummary"></div><div id="reviewHost" class="review-list"></div><div id="reviewActions" class="review-actions"></div></main></section>
</div>
<div id="choiceSheet" class="sheet hidden"><div class="sheet-card"><div class="sheet-top"><b id="sheetTitle">Question 1</b><button id="sheetClose" class="sheet-close">×</button></div><div id="optionGrid" class="option-grid"></div></div></div>
<script src="./data/engexam-bank.js"></script>
<script src="https://adrianxds-ads.github.io/adrian-core/components/adrian-keyboard.js?v=4"></script>
<script src="./app.js"></script>
<script src="https://adrianxds-ads.github.io/adrian-core/components/hub-nav.js?v=6"></script>
</body></html>
